name: Supabase wach halten

# Alle 3 Tage um 06:17 UTC (kostenlose Supabase-Projekte pausieren nach 7 Tagen ohne Nutzung)
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
